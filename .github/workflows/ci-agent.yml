name: Build Desktop Installers

# 仅在推送 v* tag 时触发；并且只有 LiveMix/ 目录相对上一个 v* tag 有变更时才打包。
# 打包成功后会把 DMG / 安装包发布到该 tag 对应的 GitHub Release，供直接下载。
# macOS 产物使用 Developer ID 证书签名，并通过 App Store Connect API Key 公证。
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: live-mix-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'
  PROJECT_DIR: LiveMix
  # FFmpeg 打包资产镜像前缀（其下需有 b6.1.1/<platform>/）。
  # 默认使用项目 COS；需要切换时在仓库 Variables 中设置 LIVEMIX_FFMPEG_MIRROR。
  LIVEMIX_FFMPEG_MIRROR: "${{ vars.LIVEMIX_FFMPEG_MIRROR || 'https://ffmpeg-1426793176.cos.ap-guangzhou.myqcloud.com/ffmpeg' }}"

jobs:
  changes:
    name: Detect LiveMix Changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: 准备代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测 LiveMix 是否有变更
        id: filter
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          PREV="$(git tag -l 'v*' --sort=-v:refname | awk -v cur="$CURRENT" '$0 != cur { print; exit }')"

          if [ -z "$PREV" ]; then
            echo "无上一版本 tag，将打包 ${PROJECT_DIR}"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "对比范围: $PREV -> $CURRENT (${PROJECT_DIR}/)"
          if git diff --quiet "$PREV" "$CURRENT" -- "$PROJECT_DIR"; then
            echo "${PROJECT_DIR}/ 无变更，跳过打包"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          else
            echo "${PROJECT_DIR}/ 有变更，需要打包"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    defaults:
      run:
        working-directory: LiveMix
    steps:
      - name: 准备代码
        uses: actions/checkout@v4

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: 缓存 FFmpeg
        uses: actions/cache@v4
        with:
          path: LiveMix/third_party/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('LiveMix/scripts/fetch-ffmpeg.sh') }}

      - name: 下载 FFmpeg
        run: ./scripts/fetch-ffmpeg.sh --output "third_party/ffmpeg/macos-${{ matrix.arch }}"

      - name: 导入 macOS 签名证书
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "缺少签名证书密钥: CSC_LINK / CSC_KEY_PASSWORD" >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$CSC_LINK" | openssl base64 -d -A -out "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "证书中未找到 Developer ID Application 签名身份" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"
          echo "签名身份: $SIGN_IDENTITY"

      - name: 准备 App Store Connect API Key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "缺少公证密钥: APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER" >&2
            exit 1
          fi

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | openssl base64 -d -A -out "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$API_KEY_PATH"; then
            echo "APPLE_API_KEY_BASE64 解码后不是有效的 .p8 私钥" >&2
            exit 1
          fi

          echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "API Key 已就绪: $API_KEY_PATH"

      - name: 编译并生成 DMG
        run: |
          ./scripts/pack-macos.sh --clean \
            --version "${GITHUB_REF_NAME#v}" \
            --qt "$QT_ROOT_DIR" \
            --ffmpeg-dir "third_party/ffmpeg/macos-${{ matrix.arch }}/bin" \
            --sign "$SIGN_IDENTITY"

      - name: 公证并装订 DMG
        timeout-minutes: 60
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(dist/LiveMixStudio-*.dmg)
          DMG_PATH="${dmg_files[0]:-}"
          if [ -z "$DMG_PATH" ]; then
            echo "未找到待公证的 DMG" >&2
            exit 1
          fi
          echo "待公证: $DMG_PATH"

          NOTARY_ARGS=(--key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          SUBMIT_LOG="$(mktemp)"
          if ! xcrun notarytool submit "$DMG_PATH" "${NOTARY_ARGS[@]}" --wait --timeout 50m | tee "$SUBMIT_LOG"; then
            SUBMISSION_ID="$(sed -n 's/.*[Ii][Dd]: \([0-9a-fA-F-]\{36\}\).*/\1/p' "$SUBMIT_LOG" | head -n1)"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "公证失败，获取日志: $SUBMISSION_ID" >&2
              xcrun notarytool log "$SUBMISSION_ID" "${NOTARY_ARGS[@]}" >&2 || true
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"

          # 装订会修改 DMG 内容，需要重新生成 SHA256 校验和
          shasum -a 256 "$DMG_PATH" | awk '{print $1}' > "$DMG_PATH.sha256"
          echo "公证完成: $DMG_PATH"

      - name: 清理 macOS 凭据
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "$APPLE_API_KEY" || true
          fi

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: LiveMixStudio-macos-${{ matrix.arch }}
          path: |
            LiveMix/dist/*.dmg
            LiveMix/dist/*.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 Installer
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: LiveMix
    steps:
      - name: 准备代码
        uses: actions/checkout@v4

      - name: 配置 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
          # aqtinstall 3.3.0 不认识 Qt 6.11+ 在 Windows 上改用的仓库结构：
          # 现在的目录是 qt6_6120/qt6_6120_msvc2022_64/，它会去请求
          # qt6_6120/qt6_6120/Updates.xml，直接报
          # "Failed to locate XML data for Qt version '6.12.0'"。
          # 固定到包含修复（miurahr/aqtinstall#1000）的 master 提交。
          aqtsource: 'https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.tar.gz'

      - name: 缓存 FFmpeg
        uses: actions/cache@v4
        with:
          path: LiveMix/third_party/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-x64-${{ hashFiles('LiveMix/scripts/fetch-ffmpeg.ps1') }}

      - name: 下载 FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: 安装 NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }

      - name: 编译并生成安装包
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^[vV]', ''
          ./scripts/pack-windows.ps1 -Configuration Release -BuildDir build `
            -QtPath "$env:QT_ROOT_DIR" -Version $version -Clean

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: LiveMixStudio-windows-x64
          path: |
            LiveMix/dist/*-setup.exe
            LiveMix/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [changes, macos, windows]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          pattern: LiveMixStudio-*
          path: release-assets
          merge-multiple: true

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          assets=(*.dmg *.dmg.sha256 *-setup.exe *-setup.exe.sha256)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "错误: 未找到可发布的安装包" >&2
            ls -la
            exit 1
          fi

          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖上传安装包"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "LiveMix Studio $tag" \
              --generate-notes
          fi
          echo "已发布 ${#assets[@]} 个文件到 Release $tag"
